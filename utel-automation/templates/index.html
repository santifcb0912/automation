<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">



    <script src="https://unpkg.com/htmx.org@1.9.10"></script>


    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>


    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">◈</span>
                <span class="logo-text">UTEL Lead Tester</span>
            </div>
            <div class="header-status" id="status-indicator">
                <span class="status-dot idle"></span>
                <span class="status-text">En espera</span>
            </div>
        </div>
    </header>

    <main class="main">


        <section class="control-panel">
            <h2 class="section-title">Configuración</h2>




            <form
                id="run-form"
                hx-post="/api/run"
                hx-swap="none"
                hx-trigger="submit"
                hx-on::after-request="onRunStarted(event)"
            >
                <div class="form-grid">


                    <div class="form-group">
                        <label class="form-label" for="country">País</label>
                        <select class="form-select" id="country" name="country" required>
                            <option value="">— Selecciona un país —</option>
                            {% for country in countries %}
                            <option value="{{ country }}">{{ country }}</option>
                            {% endfor %}
                        </select>
                    </div>


                    <div class="form-group">
                        <label class="form-label" for="sheet_id">
                            ID de Google Sheets
                            <span class="label-hint">(opcional — usa el del .env si se omite)</span>
                        </label>
                        <input
                            class="form-input"
                            type="text"
                            id="sheet_id"
                            name="sheet_id"
                            placeholder="Pega aquí el ID del Sheets del mes actual"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label" for="sheet_tab">
                            Hoja
                            <span class="label-hint">(opcional — detecta automáticamente)</span>
                        </label>
                        <input
                            class="form-input"
                            type="text"
                            id="sheet_tab"
                            name="sheet_tab"
                            placeholder="Ej: 27-30"
                        >
                    </div>

                </div>


                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary" id="btn-start">
                        <span class="btn-icon">▶</span>
                        Iniciar scraping
                    </button>
                    <button
                        type="button"
                        class="btn btn-danger"
                        id="btn-stop"
                        disabled
                        onclick="stopProcess()"
                    >
                        <span class="btn-icon">■</span>
                        Detener
                    </button>
                </div>
            </form>
        </section>


        <section class="progress-section" id="progress-section" style="display:none">
            <div class="progress-header">
                <span class="progress-label" id="progress-label">Iniciando...</span>
                <span class="progress-count" id="progress-count">0 / 0</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
            </div>

            <div class="processing-now" id="processing-now" style="display:none">
                <span class="processing-icon">⟳</span>
                <span id="processing-text">Procesando...</span>
            </div>
        </section>



        <div
            class="results-grid"
            id="results-container"
            hx-ext="sse"
            sse-connect="/api/stream"
            sse-swap="message"
            hx-on:sse:message="handleSSEMessage(event)"
        >


            <div class="results-column success-column">
                <div class="column-header success-header">
                    <span class="column-icon">✓</span>
                    <span class="column-title">Leads llegaron</span>
                    <span class="column-count" id="success-count">0</span>
                </div>
                <div class="results-list" id="success-list">

                    <div class="empty-state">
                        <span>Los leads confirmados aparecerán aquí</span>
                    </div>
                </div>
            </div>


            <div class="results-column error-column">
                <div class="column-header error-header">
                    <span class="column-icon">✗</span>
                    <span class="column-title">No llegaron — revisar</span>
                    <span class="column-count" id="error-count">0</span>
                </div>
                <div class="results-list" id="error-list">

                    <div class="empty-state">
                        <span>Los leads con error aparecerán aquí</span>
                    </div>
                </div>
            </div>

        </div>


        <section class="summary-panel" id="summary-panel" style="display:none">
            <h3 class="summary-title">Resumen final</h3>
            <div class="summary-stats">
                <div class="stat-item">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item success">
                    <span class="stat-value" id="stat-success">0</span>
                    <span class="stat-label">Exitosos</span>
                </div>
                <div class="stat-item error">
                    <span class="stat-value" id="stat-errors">0</span>
                    <span class="stat-label">Errores</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="stat-time">0</span>
                    <span class="stat-label">Minutos</span>
                </div>
            </div>
        </section>

    </main>


    <script>
        let successCount = 0;
        let errorCount = 0;
        let totalLeads = 0;
        let processedLeads = 0;

        /**
         * Se llama cuando el servidor confirma que el proceso inició.
         * Actualiza la UI para mostrar que está corriendo.
         */
        function onRunStarted(event) {
            document.querySelector('.status-dot').className = 'status-dot running';
            document.querySelector('.status-text').textContent = 'Procesando...';

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;

            document.getElementById('progress-section').style.display = 'block';

            successCount = 0;
            errorCount = 0;
            totalLeads = 0;
            processedLeads = 0;
            document.getElementById('success-count').textContent = '0';
            document.getElementById('error-count').textContent = '0';

            document.getElementById('success-list').innerHTML =
                '<div class="empty-state"><span>Esperando leads...</span></div>';
            document.getElementById('error-list').innerHTML =
                '<div class="empty-state"><span>Sin errores por ahora</span></div>';

            document.getElementById('summary-panel').style.display = 'none';
        }

        /**
         * Maneja los eventos SSE que llegan del servidor.
         * Cada tipo de evento actualiza una parte diferente de la UI.
         */
        function handleSSEMessage(event) {
            try {
                const parsed = JSON.parse(event.detail.data);
                const type = parsed.type;
                const data = parsed.data;

                switch(type) {

                    case 'leads_loaded':
                        totalLeads = data.total;
                        document.getElementById('progress-label').textContent =
                            `${data.country} — Hoja ${data.tab}`;
                        document.getElementById('progress-count').textContent =
                            `0 / ${totalLeads}`;
                        break;

                    case 'processing':
                        document.getElementById('processing-now').style.display = 'flex';
                        document.getElementById('processing-text').textContent =
                            `Procesando: ${data.email} (${data.index}/${data.total})`;
                        break;

                    case 'success':
                        addSuccessItem(data);
                        successCount++;
                        processedLeads++;
                        updateProgress();
                        break;

                    case 'lead_error':
                        addErrorItem(data);
                        errorCount++;
                        processedLeads++;
                        updateProgress();
                        break;

                    case 'done':
                        showSummary(data);
                        onProcessFinished();
                        break;

                    case 'error':
                        showCriticalError(data.message);
                        onProcessFinished();
                        break;

                    case 'heartbeat':
                    case 'stream_end':
                        break;
                }

            } catch(e) {
            }
        }

        /**
         * Agrega un lead exitoso a la columna verde.
         */
        function addSuccessItem(data) {
            const list = document.getElementById('success-list');

            const emptyState = list.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const item = document.createElement('div');
            item.className = 'result-item success-item';
            item.innerHTML = `
                <div class="result-email">${data.email}</div>
                <div class="result-meta">
                    <span class="result-nivel">${data.nivel || ''}</span>
                    <span class="result-row">Fila ${data.row}</span>
                </div>
                <a class="result-link" href="${data.link}" target="_blank">
                    Ver captura →
                </a>
            `;

            list.insertBefore(item, list.firstChild);

            document.getElementById('success-count').textContent = successCount + 1;
        }

        /**
         * Agrega un lead con error a la columna roja.
         */
        function addErrorItem(data) {
            const list = document.getElementById('error-list');

            const emptyState = list.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const item = document.createElement('div');
            item.className = 'result-item error-item';
            item.innerHTML = `
                <div class="result-email">${data.email}</div>
                <div class="result-meta">
                    <span class="result-reason">${data.reason}</span>
                    <span class="result-row">Fila ${data.row}</span>
                </div>
                <div class="result-url">${data.url.substring(0, 60)}...</div>
            `;

            list.insertBefore(item, list.firstChild);

            document.getElementById('error-count').textContent = errorCount + 1;
        }

        /**
         * Actualiza la barra de progreso.
         */
        function updateProgress() {
            if (totalLeads === 0) return;

            const percentage = Math.round((processedLeads / totalLeads) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-count').textContent =
                `${processedLeads} / ${totalLeads}`;
        }

        /**
         * Muestra el panel de resumen final.
         */
        function showSummary(data) {
            document.getElementById('stat-total').textContent = data.total || 0;
            document.getElementById('stat-success').textContent = data.successful || 0;
            document.getElementById('stat-errors').textContent = data.errors || 0;
            document.getElementById('stat-time').textContent = data.elapsed_minutes || 0;
            document.getElementById('summary-panel').style.display = 'block';
            document.getElementById('processing-now').style.display = 'none';
        }

        /**
         * Restaura la UI al estado inicial cuando el proceso termina.
         */
        function onProcessFinished() {
            document.querySelector('.status-dot').className = 'status-dot idle';
            document.querySelector('.status-text').textContent = 'Proceso completado';
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
            document.getElementById('progress-bar').style.width = '100%';
        }

        /**
         * Muestra un error crítico en la UI.
         */
        function showCriticalError(message) {
            document.getElementById('progress-label').textContent = `Error: ${message}`;
            document.getElementById('progress-label').style.color = '#ff4444';
        }

        /**
         * Llama al endpoint /api/stop para cancelar el proceso.
         */
        async function stopProcess() {
            const response = await fetch('/api/stop', { method: 'POST' });
            const data = await response.json();
            document.querySelector('.status-text').textContent = 'Detenido por el usuario';
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
        }
    </script>

</body>
</html>
